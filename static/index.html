<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crewboard</title>
<meta name="description" content="Crewboard — 人と AI エージェントが一緒に見て操作するジョブボード。WebMCP (navigator.modelContext) ツール対応。REST: api/jobs">
<link rel="icon" type="image/svg+xml" href="static/favicon.svg">
<link rel="stylesheet" href="static/style.css">
<script>try{var qt=new URLSearchParams(location.search).get('theme');if(qt)localStorage.setItem('jb-theme',qt);document.documentElement.dataset.theme=localStorage.getItem('jb-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){}</script>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="サイドバー">
    <a class="brand" href="#/" aria-label="Crewboard ホーム"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>Crewboard</a>
    <nav class="snav" aria-label="ビュー切替">
      <a href="#/" data-nav="board"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>ジョブボード<span class="n" id="cnt-board">0</span></a>
      <a href="#/draft" data-nav="draft"><svg viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>仮タスク<span class="n" id="cnt-draft">0</span></a>
      <a href="#/done" data-nav="done"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>完了履歴<span class="n" id="cnt-done">0</span></a>
      <a href="#/master" data-nav="master"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>マスタ管理</a>
    </nav>
    <div class="sfoot">
      <div class="theme" role="group" aria-label="テーマ">
        <button data-theme-set="light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>ライト</button>
        <button data-theme-set="dark"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>ナイト</button>
      </div>
    </div>
  </aside>
  <main class="main" id="main" aria-live="polite"></main>
</div>
<dialog id="new-dlg" aria-label="ジョブを作成"><form method="dialog" id="new-form">
  <h2>ジョブを作成</h2>
  <label>タイトル<input name="title" required></label>
  <label>完了条件<textarea name="conditions" rows="2"></textarea></label>
  <label>方針<textarea name="policy" rows="2"></textarea></label>
  <label>タグ（カンマ区切り）<input name="tags"></label>
  <div class="dlg-btn"><button value="cancel" formnovalidate>キャンセル</button><button class="primary" value="ok">作成</button></div>
</form></dialog>
<dialog id="del-dlg" class="danger-dlg" aria-label="ジョブの削除"><form method="dialog" id="del-form">
  <h2>このジョブを削除しますか？</h2>
  <p>ジョブ <b id="del-num"></b> とそのタスク・変更履歴を完全に削除します。完了履歴には残らず、元に戻せません。</p>
  <label>確認のためジョブ番号 <b id="del-num2"></b> を入力<input name="confirm" autocomplete="off" inputmode="numeric" aria-label="ジョブ番号を入力"></label>
  <div class="dlg-btn"><button value="cancel" formnovalidate>キャンセル</button><button class="danger" id="del-ok" value="ok" disabled>削除する</button></div>
</form></dialog>
<div class="toast" id="toast" role="status"></div>
<script src="static/app.js"></script>
</body></html>
